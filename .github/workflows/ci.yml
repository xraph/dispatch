name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required by go-ci.yml's gosec SARIF upload
  security-events: write

jobs:
  # ─── Go Build & Test ────────────────────────────────────────────────
  # test, lint, verify and security now come from the shared workflow. It
  # probes for Makefile targets per step and falls back to the plain go
  # commands these jobs used to run inline.
  ci:
    uses: xraph/workflows/.github/workflows/go-ci.yml@v1
    with:
      go-versions: '["1.26.9"]'
      os: '["ubuntu-latest"]'

  qualification:
    name: Published host qualification
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOTOOLCHAIN: go1.26.9
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: qualification/go.sum
      - name: Reject effective module replacements
        working-directory: qualification
        run: |
          go list -m -json all > "$RUNNER_TEMP/dispatch-modules.json"
          jq -s -e 'all(.[]; .Replace == null)' "$RUNNER_TEMP/dispatch-modules.json"
      - name: Lint qualification
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: qualification
      - name: Verify, race test and build qualification
        run: make qualification-check
      - name: Scan qualification dependencies
        working-directory: qualification
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -test ./...
      - name: Check native source provenance helper
        run: python3 -B -m unittest discover -s qualification -p source_provenance_test.py
      - name: Qualify published durable operator HTTP and fixture
        timeout-minutes: 10
        run: make qualification-operator-check
      - name: Qualify independent PostgreSQL sink processes
        timeout-minutes: 15
        run: make qualification-process-check
      - name: Retain native qualification provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-native-source-provenance
          path: ${{ runner.temp }}/dispatch-*-evidence.*
          if-no-files-found: ignore

  writerfloor:
    name: External writer admission qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOTOOLCHAIN: go1.26.9
      GOMAXPROCS: "2"
      WRITERFLOOR_REQUIRED: "1"
      WRITERFLOOR_TEST_DSN: postgres://dispatch:dispatch@127.0.0.1:5432/dispatch?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch
        ports:
          - 5432:5432
        options: >-
          --memory=512m --cpus=1 --pids-limit=128
          --tmpfs /var/lib/postgresql/data:size=201326592
          --health-cmd "pg_isready -U dispatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: qualification/writerfloor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: qualification/writerfloor/go.sum
      - name: Reject module replacements
        run: |
          go list -m -json all > "$RUNNER_TEMP/writerfloor-modules.json"
          jq -s -e 'all(.[]; .Replace == null)' "$RUNNER_TEMP/writerfloor-modules.json"
      - name: Lint writer admission and Linux custody harness
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: qualification/writerfloor
      - name: Verify, race test and build
        run: make check
      - name: Scan qualification dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -test ./...

  # ─── Format Check ──────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting (goimports)
        run: |
          OUTPUT=$(goimports -l -local github.com/xraph/dispatch .)
          if [ -n "$OUTPUT" ]; then
            echo "::error::The following files need goimports formatting:"
            echo "$OUTPUT"
            exit 1
          fi

  # ─── Docs ───────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm types:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  query-removal-guard:
    name: Native query removal guard compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOTOOLCHAIN: go1.26.9
      GOMAXPROCS: "2"
      DISPATCH_LIFECYCLE_TEST_DSN: postgres://dispatch:dispatch@127.0.0.1:5432/dispatch?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch
          POSTGRES_INITDB_ARGS: --wal-segsize=1
        ports:
          - 5432:5432
        options: >-
          --memory=512m --cpus=1 --pids-limit=128
          --tmpfs /var/lib/postgresql/data:size=201326592
          --health-cmd "pg_isready -U dispatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: |
            go.sum
            qualification/oldwriter/go.sum
            qualification/protocolone/go.sum
            qualification/querypreguard/go.sum
      - name: Verify historical query harness
        working-directory: qualification/querypreguard
        run: |
          go mod tidy -diff
          go mod verify
          go list -m -json all > "$RUNNER_TEMP/dispatch-modules.json"
          jq -s -e 'all(.[]; .Replace == null)' "$RUNNER_TEMP/dispatch-modules.json"
          go vet ./...
      - name: Qualify native guards and historical writers
        run: make qualification-queryguard-check
